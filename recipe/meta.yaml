{% set version = "1.1.2" %}

package:
  name: matplotlib-venn
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/m/matplotlib-venn/matplotlib-venn-{{ version }}.tar.gz
  sha256: 6f2b07a03e9bb5a62de2f32f965216739e175176f9d654dd19e7af2c22ec36e3

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - matplotlib-base
    - numpy
    - scipy
  run_constrained:
    - shapely

test:
  source_files:
    - tests
  imports:
    - matplotlib_venn
  commands:
    - pip check
    - pytest -v tests/
  requires:
    - pip
    - pytest

about:
  home: https://github.com/konstantint/matplotlib-venn
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: Functions for plotting area-proportional two- and three-way Venn diagrams in matplotlib.
  description: |
    Routines for plotting area-weighted two- and three-circle venn diagrams.
  dev_url: https://github.com/konstantint/matplotlib-venn
  doc_url: https://github.com/konstantint/matplotlib-venn

extra:
  recipe-maintainers:
    - pmlandwehr
    - ocefpaf
